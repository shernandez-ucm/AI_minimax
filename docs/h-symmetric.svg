<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>Symmetric threes compared with Kaggle weights</title>
<rect x="0.5" y="0.5" width="759" height="319" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="34" font-size="18" fill="#1f2328" font-weight="700">Symmetric threes: h = F₃ − O₃</text><text x="24" y="54" font-size="12" fill="#57606a">Same features as Kaggle, equal weights. Bars: each term’s contribution on the example position (same scale).</text><line x1="560" y1="80" x2="560" y2="250" stroke="#1f2328"/><text x="560" y="268" font-size="11" text-anchor="middle" fill="#57606a">0</text><text x="240" y="268" font-size="11" text-anchor="middle" fill="#57606a">−100</text><line x1="240" y1="250" x2="240" y2="256" stroke="#57606a"/><text x="24" y="112" font-size="14" fill="#1f2328" font-weight="700">Kaggle</text><text x="24" y="132" font-size="13" fill="#7b1fa2" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">h = -98</text><rect x="560" y="90" width="6.4" height="20" rx="3" fill="#13853b"/><text x="572.4" y="105" font-size="12" text-anchor="start" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">+1·F₃ = +2</text><rect x="240" y="116" width="320" height="20" rx="3" fill="#7b1fa2"/><text x="248" y="131" font-size="12" fill="#ffffff" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">−100·O₃ = -100</text><text x="24" y="197" font-size="14" fill="#1f2328" font-weight="700">Symmetric</text><text x="24" y="217" font-size="13" fill="#13853b" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">h = 1</text><rect x="560" y="175" width="6.4" height="20" rx="3" fill="#13853b"/><text x="572.4" y="190" font-size="12" text-anchor="start" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">+1·F₃ = +2</text><rect x="556.8" y="201" width="3.2" height="20" rx="3" fill="#7b1fa2"/><text x="550.8" y="216" font-size="12" text-anchor="end" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">−1·O₃ = -1</text><text x="24" y="298" font-size="12" fill="#1f2328">Kaggle plays mostly defence (many draws in the round robin); symmetric weighs attack and defence equally.</text>
</svg>
