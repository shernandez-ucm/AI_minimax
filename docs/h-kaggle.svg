2328" font-weight="700">F₄ = O₄ = 0</text><text x="600" y="140" font-size="12" fill="#57606a">A four is a finished game;</text><text x="600" y="156" font-size="12" fill="#57606a">search scores it as ±1e9</text><text x="600" y="172" font-size="12" fill="#57606a">before h is ever called.</text><text x="600" y="230" font-size="13" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">h = 0 + 2 − 100 − 0</text><text x="600" y="254" font-size="18" fill="#7b1fa2" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">  = -98</text><text x="600" y="282" font-size="12" fill="#57606a">Reads as “X is losing”,</text><text x="600" y="298" font-size="12" fill="#57606a">though X has two threes</text><text x="600" y="314" font-size="12" fill="#57606a">to O’s one.</text>
