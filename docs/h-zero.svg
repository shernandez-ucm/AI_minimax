xt><text x="572" y="171" font-size="12" text-anchor="middle" fill="#d32f2f" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">−1e9</text><line x1="572" y1="176" x2="524" y2="228" stroke="#d0d7de"/><circle cx="524" cy="236" r="6" fill="#f6f8fa" stroke="#d0d7de"/><line x1="572" y1="176" x2="540" y2="228" stroke="#d0d7de"/><circle cx="540" cy="236" r="6" fill="#f6f8fa" stroke="#d0d7de"/><line x1="572" y1="176" x2="556" y2="228" stroke="#d0d7de"/><circle cx="556" cy="236" r="6" fill="#f6f8fa" stroke="#d0d7de"/><line x1="572" y1="176" x2="572" y2="228" stroke="#d0d7de"/><circle cx="572" cy="236" r="6" fill="#f6f8fa" stroke="#d0d7de"/><line x1="572" y1="176" x2="588" y2="228" stroke="#d0d7de"/><circle cx="588" cy="236" r="6" fill="#f6f8fa" stroke="#d0d7de"/><line x1="572" y1="176" x2="604" y2="228" stroke="#7b1fa2" stroke-width="2"/><circle cx="604" cy="236" r="6" fill="#f6b70f" stroke="#a87900"/><line x1="572" y1="176" x2="620" y2="228" stroke="#d0d7de"/><circle cx="620" cy="236" r="6" fill="#f6f8fa" stroke="#d0d7de"/><text x="612" y="266" font-size="11" text-anchor="middle" fill="#7b1fa2">O plays col 5,</text><text x="612" y="280" font-size="11" text-anchor="middle" fill="#7b1fa2">wins at (4,5)</text><rect x="638" y="144" width="60" height="32" rx="6" fill="#f6f8fa" stroke="#d0d7de"/><text x="668" y="158" font-size="11" text-anchor="middle" fill="#57606a">col 6</text><text x="668" y="171" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0</text><path d="M668 176 L646 240 L690 240 Z" fill="#f6f8fa" stroke="#d0d7de"/><text x="668" y="236" font-size="10" text-anchor="middle" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0·0·0</text><text x="24" y="312" font-size="12" fill="#1f2328">Result: columns 0, 1, 2, 3, 4, 6 tie at 0 → picked at random. Zero only knows to avoid column 5.</text>
</svg>
