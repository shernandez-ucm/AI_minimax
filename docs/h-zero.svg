<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>Zero heuristic: only terminal leaves inside the horizon matter</title>
<rect x="0.5" y="0.5" width="759" height="329" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="34" font-size="18" fill="#1f2328" font-weight="700">Zero (blind): h = 0</text><text x="24" y="54" font-size="12" fill="#57606a">Every non-terminal leaf looks the same, so only wins and losses inside the horizon matter (example position, N = 2).</text><line x1="30" y1="248" x2="730" y2="248" stroke="#8c959f" stroke-dasharray="6 5"/><text x="30" y="262" font-size="11" fill="#57606a">horizon: ply 2 (leaves scored by h)</text><line x1="380" y1="104" x2="92" y2="144" stroke="#8c959f"/><line x1="380" y1="104" x2="188" y2="144" stroke="#8c959f"/><line x1="380" y1="104" x2="284" y2="144" stroke="#8c959f"/><line x1="380" y1="104" x2="380" y2="144" stroke="#8c959f"/><line x1="380" y1="104" x2="476" y2="144" stroke="#8c959f"/><line x1="380" y1="104" x2="572" y2="144" stroke="#8c959f"/><line x1="380" y1="104" x2="668" y2="144" stroke="#8c959f"/><circle cx="380" cy="90" r="15" fill="#d32f2f" stroke="#8e1b1b"/><text x="404" y="94" font-size="12" fill="#1f2328">X to move (max)</text><rect x="62" y="144" width="60" height="32" rx="6" fill="#f6f8fa" stroke="#d0d7de"/><text x="92" y="158" font-size="11" text-anchor="middle" fill="#57606a">col 0</text><text x="92" y="171" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0</text><path d="M92 176 L70 240 L114 240 Z" fill="#f6f8fa" stroke="#d0d7de"/><text x="92" y="236" font-size="10" text-anchor="middle" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0·0·0</text><rect x="158" y="144" width="60" height="32" rx="6" fill="#f6f8fa" stroke="#d0d7de"/><text x="188" y="158" font-size="11" text-anchor="middle" fill="#57606a">col 1</text><text x="188" y="171" font-size="12" text-anchor="middle" fill="#1f2328" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">0</text><path d="M188 176 L166 240 L210 240 Z" fill="#f6f8fa" stroke="#d0d7de"/><text x="188" y="236" font-